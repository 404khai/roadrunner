name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --workspace --all-features --locked
      - name: Verify retained performance comparison contracts
        run: python3 -m unittest discover -s scripts -p test_phase33.py -v
      - name: Exercise bounded profiling probe without timing thresholds
        run: cargo run --locked -p roadrunner-simulation --example phase33_probe -- benchmarks/phase33/candidates-fresh64.json

      - name: Build bounded scale harness
        run: cargo build --locked -p roadrunner-simulation --example phase34_workload
      - name: Verify workload generation, evidence equivalence and external stop classification
        env:
          PHASE34_BINARY: target/debug/examples/phase34_workload
        run: python3 -m unittest discover -s scripts -p test_phase34.py -v

      - name: Build comparison-suite adapters
        run: cargo build --locked -p roadrunner-cli --bin roadrunner --example routing_comparison
      - name: Verify benchmark suite accounting, matched inputs and replay (no timing thresholds)
        run: python3 -m unittest discover -s scripts -p test_benchmark_suite.py -v

      - name: Reproduce retained fleet captures and verify authority isolation
        run: |
          cargo build --locked -p roadrunner-api --example fleet_demo
          target/debug/examples/fleet_demo 12 web/public/demos/fleet-12.json --check
          target/debug/examples/fleet_demo 24 web/public/demos/fleet-24.json --check

  web:
    name: Routing visualization client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  learned-eta:
    name: Offline learned ETA contracts and source oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build source verifier
        run: cargo build -p roadrunner-cli --locked
      - name: Adversarial training, inference and artifact contracts
        run: python3 -m unittest discover -s ml/tests -v
      - name: Reproduce controlled negative experiment
        run: python3 ml/eta_engine.py verify ml/results/route-ridge-null-v1
      - name: Reproduce explicit unavailable fitting population
        run: python3 ml/eta_engine.py verify ml/results/route-ridge-unavailable-v1
      - name: Independent retained-source and Decimal oracles
        run: |
          python3 scripts/verify_learned_eta.py ml/results/route-ridge-null-v1
          python3 scripts/verify_learned_eta.py ml/results/route-ridge-unavailable-v1

  persistence:
    name: PostgreSQL/PostGIS persistence and process recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roadrunner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d roadrunner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROADRUNNER_TEST_DATABASE_URL: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=roadrunner_test"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Real storage transactions and restoration
        run: cargo test -p roadrunner-storage --test postgres --locked -- --ignored --test-threads=1
      - name: Real event transport, inbox, ordering and reconciliation
        run: cargo test -p roadrunner-storage --test events --locked -- --ignored --test-threads=1
      - name: Build process test binaries
        run: cargo build -p roadrunner-api -p roadrunner-events --locked
      - name: Crash, frozen restoration, lost response and COMMIT expiry
        run: python3 scripts/verify_postgres_runtime.py --output /tmp/phase-21-runtime.json
      - name: Publisher and consumer crash boundaries and isolated replay
        run: python3 scripts/verify_event_runtime.py --output /tmp/phase-22-runtime.json
