name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --workspace --all-features --locked

  persistence:
    name: PostgreSQL/PostGIS persistence and process recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roadrunner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d roadrunner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROADRUNNER_TEST_DATABASE_URL: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=roadrunner_test"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Real storage transactions and restoration
        run: cargo test -p roadrunner-storage --test postgres --locked -- --ignored --test-threads=1
      - name: Build process test binary
        run: cargo build -p roadrunner-api --locked
      - name: Crash, frozen restoration, lost response and COMMIT expiry
        run: python3 scripts/verify_postgres_runtime.py --output /tmp/phase-21-runtime.json
